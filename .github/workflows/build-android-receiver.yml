name: Build Android Receiver

on:
  push:
    paths:
      - 'Sources/BetterCastReceiverAndroid/**'
      - '.github/workflows/build-android-receiver.yml'
  workflow_dispatch:

concurrency:
  group: android-receiver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # 手动触发时需要写权限发布 Release

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: Sources/BetterCastReceiverAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' Sources/BetterCastReceiverAndroid/app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir -p out
          cp Sources/BetterCastReceiverAndroid/app/build/outputs/apk/debug/app-debug.apk \
             "out/BetterCast-Receiver-Android-zh-Hans-$version.apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterCast-Receiver-Android-zh-Hans-${{ env.version }}
          path: out/*.apk
          retention-days: 30

      # 仅在手动触发时发布，避免每次 push 都生成 Release
      - name: Publish Android release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-hans-android-v${{ env.version }}
          name: BetterCast 中文版（Android）v${{ env.version }}
          body: |
            BetterCast Android 接收端构建（社区汉化，非官方发布）。

            简体中文资源随系统语言自动切换；Android 13 及以上可在
            「设置 › 应用 › BetterCast 接收端 › 语言」单独设为简体中文。

            该 APK 使用调试签名，安装时若已装官方版需先卸载。
          prerelease: true
          files: out/*.apk
