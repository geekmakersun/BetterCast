name: Build Android Receiver

on:
  push:
    paths:
      - 'Sources/BetterCastReceiverAndroid/**'
      - '.github/workflows/build-android-receiver.yml'
  workflow_dispatch:

concurrency:
  group: android-receiver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # 手动触发时需要写权限发布 Release

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已自带 Android SDK + cmdline-tools，直接用现成的；
      # android-actions/setup-android@v3 在该镜像上会报 "Failed to find package 'tools'"。
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # 固定签名库（PKCS12）：应用内自动更新要求新旧版本签名一致，
      # 否则系统安装器会以「签名不同」拒绝覆盖安装。
      - name: Decode signing keystore
        env:
          BC_KEYSTORE_BASE64: ${{ secrets.BC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BC_KEYSTORE_BASE64" ]; then
            echo "::warning::BC_KEYSTORE_BASE64 未配置，将退回 debug 签名（无法覆盖安装）"
            exit 0
          fi
          echo "$BC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bettercast-release.p12"
          echo "BC_KEYSTORE=$RUNNER_TEMP/bettercast-release.p12" >> "$GITHUB_ENV"
          echo "已写入签名库：$(stat -c%s "$RUNNER_TEMP/bettercast-release.p12") bytes"

      - name: Build APK
        working-directory: Sources/BetterCastReceiverAndroid
        env:
          BC_KEYSTORE_PASSWORD: ${{ secrets.BC_KEYSTORE_PASSWORD }}
          BC_KEY_PASSWORD: ${{ secrets.BC_KEY_PASSWORD }}
          BC_KEY_ALIAS: ${{ secrets.BC_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$BC_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' Sources/BetterCastReceiverAndroid/app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir -p out
          apk=Sources/BetterCastReceiverAndroid/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || apk=Sources/BetterCastReceiverAndroid/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" "out/BetterCast-Receiver-Android-zh-Hans-$version.apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterCast-Receiver-Android-zh-Hans-${{ env.version }}
          path: out/*.apk
          retention-days: 30

      # 仅在手动触发时发布，避免每次 push 都生成 Release
      - name: Publish Android release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-hans-android-v${{ env.version }}
          name: BetterCast 中文版（Android）v${{ env.version }}
          body: |
            BetterCast 简体中文构建（社区汉化，非官方发布）。Windows 与 Android 版本号各自独立，互不影响。

            - `BetterCast-Receiver-Android-zh-Hans-*.apk`：Android 接收端，默认横屏，已移除打赏提示

            Android 简体中文资源随系统语言自动切换；Android 13 及以上可在
            「设置 › 应用 › BetterCast 接收端 › 语言」单独设为简体中文。
            APK 使用固定签名，应用内可自动更新；首次从旧版（debug 签名）迁移需先卸载。
          prerelease: true
          files: out/*.apk
